<!doctype html>
<meta charset="utf-8">
<title>Kartaan Click</title>
<style>
  :root { color-scheme: light dark; }
  body {
    width: 300px; margin: 0; padding: 18px 18px 14px;
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #ffffff; color: #16233a;
  }
  h1 { margin: 0 0 2px; font-size: 15px; letter-spacing: -0.01em; }
  .tool { border: 1px solid #e2e6ee; border-radius: 8px; padding: 10px 12px; margin: 12px 0 8px; }
  .tool h2 { margin: 0 0 3px; font-size: 13px; }
  .tool p { margin: 0; font-size: 12px; color: #55617a; }
  .tool button { font: inherit; font-size: 12px; padding: 5px 10px; border: 1px solid #d3dae6; margin-top: 8px;
        background: #fff; color: #1e3a8a; border-radius: 6px; cursor: pointer; }
  .tool button:hover { background: #f4f6fa; }
  .hint { font-size: 11px; color: #6b7890; margin-top: 6px; }
  footer { margin-top: 14px; font-size: 12px; color: #6b7890; }
  a { color: #1e3a8a; font-weight: 600; text-decoration: none; }
  a:hover { text-decoration: underline; }
  @media (prefers-color-scheme: dark) {
    body { background: #14181f; color: #e8ecf4; }
    .tool { border-color: #2a3140; }
    .tool p, footer, .hint { color: #98a3b8; }
    .tool button { background: #1b202a; border-color: #2a3140; color: #8fb0ff; }
    .tool button:hover { background: #232936; }
    a { color: #8fb0ff; }
  }
</style>

<h1>Kartaan Click</h1>

<div class="tool">
  <h2>Copy product details</h2>
  <p>Open a product page on Amazon.in, Meesho or Flipkart, press the button, and paste into ChatGPT, Gemini or Claude. It reads only the page you are looking at, only when you press.</p>
  <button id="copyDetails" type="button">Copy product details</button>
  <div class="hint" id="copyMsg"></div>
</div>

<footer>Everything else is in the <a href="panel.html" target="_blank">panel</a>.</footer>
<script src="popup.js"></script>
