<!doctype html>
<meta charset="utf-8">
<title>Kartaan Seller Tools</title>
<style>
  :root { color-scheme: light dark; }
  body {
    width: 300px; margin: 0; padding: 18px 18px 14px;
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #ffffff; color: #16233a;
  }
  h1 { margin: 0 0 2px; font-size: 15px; letter-spacing: -0.01em; }
  .tag { margin: 0 0 14px; font-size: 12px; color: #6b7890; }
  .tool { border: 1px solid #e2e6ee; border-radius: 8px; padding: 10px 12px; }
  .tool h2 { margin: 0 0 3px; font-size: 13px; }
  .tool p { margin: 0; font-size: 12px; color: #55617a; }
  .on { display: inline-block; margin-top: 8px; font-size: 11px; font-weight: 600;
        color: #0a7d36; background: #e6f5ec; border-radius: 20px; padding: 2px 9px; }
  footer { margin-top: 14px; font-size: 12px; color: #6b7890; }
  a { color: #1e3a8a; font-weight: 600; text-decoration: none; }
  a:hover { text-decoration: underline; }
  @media (prefers-color-scheme: dark) {
    body { background: #14181f; color: #e8ecf4; }
    .tool { border-color: #2a3140; }
    .tool p, .tag, footer { color: #98a3b8; }
    .on { color: #6ee7a0; background: #10281a; }
    a { color: #8fb0ff; }
  }
</style>

<h1>Kartaan Seller Tools</h1>
<p class="tag">Free workflow fixes for seller and warehouse tools.</p>

<div class="tool">
  <h2>VMS packing — auto-clear AWB</h2>
  <p>When you stop a recording, the AWB box empties itself and takes the cursor, so the next parcel scans straight in.</p>
  <span class="on">Active on VMS screens</span>
</div>

<footer>More tools coming. <a href="https://kartaan.com" target="_blank" rel="noopener">kartaan.com</a></footer>
